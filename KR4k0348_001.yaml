body:
  text: 陸機惠帝起居注元康元年以裴頠為侍中裴頠字逸民河東聞喜人司空秀之子也世說注二元康七年以王戎為司徒賞事虛名裴頠著崇有以釋其蔽頠雅有遠量當朝名士也又曰民之望也頠理甚淵博贍于論難著崇有貴無二論以矯虛誕之弊文辭精富為世名論三國志注二十三式乾殿集諸皇子悉在三司上宋書蔡廓傳元康九年廢太子遹為庶人愍懷太子賜典兵中郎將複紵襪一緉書鈔一百三十六永康元年趙王倫欲篡位先誅朝望乃執張華裴頠等使張林詰而斬之門下通事令史張林者黑山賊張飛燕之曾孫林與趙王倫為亂未及周年位至尚書令衛將軍封郡公尋為倫所殺三國志注八有雲母幌書鈔王浚乘勝追石超軍于斥邱超持重不與戰以鹿角步安立上三營御覽三百三十七書鈔
